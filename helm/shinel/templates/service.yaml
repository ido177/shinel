apiVersion: v1
kind: Service
metadata:
  name: {{ include "shinel.fullname" . }}
  labels:
    {{- include "shinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: {{ (.Values.service | default dict).type | default "ClusterIP" }}
  selector:
    {{- include "shinel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  ports:
    - name: http
      port: {{ (.Values.service | default dict).port | default 8080 }}
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shinel.fullname" . }}-admin
  labels:
    {{- include "shinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
spec:
  type: ClusterIP
  selector:
    {{- include "shinel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: proxy
  ports:
    - name: admin
      port: {{ dig "service" "port" 8081 (.Values.admin | default dict) }}
      targetPort: admin
{{- if .Values.ml.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shinel.fullname" . }}-ml
  labels:
    {{- include "shinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: ml
spec:
  type: ClusterIP
  selector:
    {{- include "shinel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: ml
  ports:
    - name: http
      port: 8000
      targetPort: http
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shinel.fullname" . }}-redis
  labels:
    {{- include "shinel.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  selector:
    {{- include "shinel.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
{{- end }}
