{{- $secretName := include "shinel.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $admin := (.Values.admin | default dict).token -}}
{{- if not $admin -}}
  {{- if and $existing (index $existing.data "admin-token") -}}
    {{- $admin = index $existing.data "admin-token" | b64dec -}}
  {{- else -}}
    {{- $admin = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
{{- $redis := .Values.redis | default dict -}}
{{- $redisPass := $redis.password -}}
{{- if and $redis.enabled (not $redisPass) -}}
  {{- if and $existing (index $existing.data "redis-password") -}}
    {{- $redisPass = index $existing.data "redis-password" | b64dec -}}
  {{- else -}}
    {{- $redisPass = randAlphaNum 32 -}}
  {{- end -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "shinel.labels" . | nindent 4 }}
type: Opaque
stringData:
  admin-token: {{ $admin | quote }}
  {{- if $redis.enabled }}
  redis-password: {{ $redisPass | quote }}
  redis-url: {{ printf "redis://:%s@%s-redis:6379/0" ($redisPass | urlquery) (include "shinel.fullname" .) | quote }}
  {{- else if $redis.url }}
  redis-url: {{ $redis.url | quote }}
  {{- end }}
