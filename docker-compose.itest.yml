# Local integration stack. No OpenAI: the proxy talks to `upstream` on shinel-net.
# The sidecar loads ml_engine.model from the same config.yaml as make up.
services:
  ml-engine:
    build:
      context: .
      dockerfile: Dockerfile.python
      secrets:
        - hf_token
    image: shinel-ml-engine:latest
    expose:
      - "8000"
    environment:
      SHINEL_CONFIG: /etc/shinel/config.yaml
    volumes:
      - ./config.yaml:/etc/shinel/config.yaml:ro
    networks:
      - shinel-net

  upstream:
    image: python:3.12-slim
    volumes:
      - ./itest/upstream.py:/upstream.py:ro
    command: ["python", "/upstream.py"]
    expose:
      - "8080"
    networks:
      - shinel-net

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    image: shinel-proxy:latest
    expose:
      - "8080"
    environment:
      SHINEL_ML_URL: http://ml-engine:8000/analyze
      SHINEL_TARGET_URL: http://upstream:8080
    volumes:
      - ./config.yaml:/etc/shinel/config.yaml:ro
    depends_on:
      ml-engine:
        condition: service_healthy
      upstream:
        condition: service_started
    networks:
      - shinel-net

  tester:
    build:
      context: .
      dockerfile: Dockerfile.itest
    image: shinel-itest:latest
    environment:
      PROXY_URL: http://proxy:8080
      UPSTREAM_URL: http://upstream:8080
      ML_URL: http://ml-engine:8000
    depends_on:
      ml-engine:
        condition: service_healthy
      proxy:
        condition: service_started
      upstream:
        condition: service_started
    networks:
      - shinel-net

networks:
  shinel-net:

secrets:
  hf_token:
    environment: HF_TOKEN
