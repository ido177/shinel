<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shinel</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A7%A5%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e6edf3;
      --muted: #8b949e;
      --card: #161b22;
      --border: #30363d;
      --accent: #3fb950;
      --warn: #d29922;
      --nav: 200px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      font: 14px/1.45 ui-sans-serif, system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
    }
    header .top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    header h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header p { margin: 0; color: var(--muted); font-size: 13px; }
    header .actions { display: flex; align-items: center; gap: 8px; }
    .mark { font-size: 22px; line-height: 1; }
    .gh {
      color: var(--fg);
      display: flex;
      padding: 6px;
      border-radius: 6px;
    }
    .gh:hover { background: var(--card); }
    .gh svg { display: block; }
    .layout { flex: 1; display: flex; min-height: 0; }
    nav {
      width: var(--nav);
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 16px 12px;
      border-right: 1px solid var(--border);
    }
    nav button {
      background: transparent;
      color: var(--muted);
      border: 1px solid transparent;
      border-radius: 6px;
      padding: 8px 12px;
      text-align: left;
      cursor: pointer;
    }
    nav button.on {
      color: var(--fg);
      background: var(--card);
      border-color: var(--border);
    }
    main { flex: 1; min-width: 0; padding: 16px 20px 24px; overflow: auto; }
    section { display: none; }
    section.on { display: block; }
    .nums { display: flex; gap: 12px; margin-bottom: 16px; }
    .num {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px 16px;
      min-width: 140px;
    }
    .num b { display: block; font-size: 22px; }
    .num span { color: var(--muted); font-size: 12px; }
    .log {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      overflow: auto;
      max-height: calc(100vh - 120px);
      white-space: pre-wrap;
      word-break: break-word;
      font: 12px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--border); vertical-align: top; }
    th { color: var(--muted); font-weight: 500; }
    .req { margin-bottom: 16px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
    .req h3 { margin: 0; padding: 10px 12px; font-size: 13px; font-weight: 500; border-bottom: 1px solid var(--border); }
    .token { color: var(--accent); font-family: ui-monospace, monospace; }
    .empty { color: var(--muted); padding: 16px 0; }
    .note { color: var(--warn); font-size: 12px; margin: 0 0 12px; }
    .field {
      display: grid;
      grid-template-columns: minmax(140px, 220px) 1fr auto;
      gap: 8px 12px;
      align-items: start;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .field label { color: var(--muted); padding-top: 4px; }
    .field .val {
      font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
      word-break: break-word;
      padding-top: 4px;
    }
    .copy {
      background: var(--card);
      color: var(--fg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 4px 10px;
      cursor: pointer;
      font-size: 12px;
    }
    .copy:hover { border-color: var(--muted); }
    .copy.ok { color: var(--accent); }
    #out { display: none; }
    #out.on { display: inline; }
    #gate {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      align-items: center;
      justify-content: center;
      background: var(--bg);
    }
    #gate.on { display: flex; }
    #gate form {
      width: min(360px, calc(100vw - 32px));
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
    }
    #gate h2 { margin: 0 0 8px; font-size: 18px; }
    #gate p { margin: 0 0 16px; color: var(--muted); }
    #gate input {
      width: 100%;
      margin-bottom: 12px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--bg);
      color: var(--fg);
    }
    #gate button {
      width: 100%;
      padding: 8px 10px;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: #0f1419;
      font-weight: 600;
      cursor: pointer;
    }
    #loginerr { color: #f85149; min-height: 1.2em; margin: 8px 0 0; }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <h1><span class="mark" aria-hidden="true">🧥</span> Shinel</h1>
      <div class="actions">
        <button type="button" id="out" class="copy">Sign out</button>
        <a class="gh" href="https://github.com/ido177/shinel" target="_blank" rel="noopener noreferrer" aria-label="Shinel on GitHub">
        <svg width="22" height="22" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8"/>
        </svg>
      </a>
      </div>
    </div>
    <p>local dashboard — values here are unmasked</p>
  </header>
  <div class="layout">
    <nav>
      <button data-tab="logs" class="on">Logs</button>
      <button data-tab="config">Config</button>
      <button data-tab="stats">Stats</button>
    </nav>
    <main>
      <section id="logs" class="on">
        <div class="log" id="logbox">connecting…</div>
      </section>
      <section id="config">
        <div id="cfg"></div>
      </section>
      <section id="stats">
        <p class="note">Mappings are stored in this process only and vanish on restart.</p>
        <div class="nums">
          <div class="num"><b id="nreq">0</b><span>requests</span></div>
          <div class="num"><b id="nmask">0</b><span>values masked</span></div>
        </div>
        <div id="recent"></div>
      </section>
    </main>
  </div>
  <div id="gate">
    <form id="login">
      <h2>Shinel</h2>
      <p>Dashboard password from <code>SHINEL_ADMIN_TOKEN</code></p>
      <input id="pw" type="password" name="password" autocomplete="current-password" placeholder="Password" autofocus>
      <button type="submit">Sign in</button>
      <p id="loginerr"></p>
    </form>
  </div>
  <script>
    const $ = (id) => document.getElementById(id);
    document.querySelectorAll("nav button").forEach((btn) => {
      btn.addEventListener("click", () => {
        document.querySelectorAll("nav button").forEach((b) => b.classList.remove("on"));
        document.querySelectorAll("main section").forEach((s) => s.classList.remove("on"));
        btn.classList.add("on");
        $(btn.dataset.tab).classList.add("on");
      });
    });

    let logs = null;
    let statsTimer = 0;
    let needsAuth = false;

    function startLogs() {
      if (logs) return;
      const logbox = $("logbox");
      logbox.textContent = "";
      logs = new EventSource("/api/logs");
      logs.addEventListener("snapshot", () => { logbox.textContent = ""; });
      logs.onmessage = (ev) => {
        const line = JSON.parse(ev.data);
        logbox.appendChild(document.createTextNode(line + "\n"));
        logbox.scrollTop = logbox.scrollHeight;
      };
      logs.onerror = () => {};
    }

    function showApp(authed) {
      $("gate").classList.toggle("on", !authed);
      $("out").classList.toggle("on", needsAuth && authed);
      if (!authed) return;
      startLogs();
      loadConfig();
      loadStats();
      if (!statsTimer) statsTimer = setInterval(loadStats, 1000);
    }

    function flatten(obj, prefix) {
      const out = [];
      if (obj == null || typeof obj !== "object") {
        out.push([prefix, obj == null ? "" : String(obj)]);
        return out;
      }
      if (Array.isArray(obj)) {
        out.push([prefix, obj.join(", ")]);
        return out;
      }
      const keys = Object.keys(obj);
      if (!keys.length) {
        out.push([prefix, ""]);
        return out;
      }
      keys.forEach((k) => {
        const path = prefix ? prefix + "." + k : k;
        const v = obj[k];
        if (v != null && typeof v === "object" && !Array.isArray(v)) {
          out.push(...flatten(v, path));
        } else if (Array.isArray(v)) {
          out.push([path, v.join(", ")]);
        } else {
          out.push([path, v == null ? "" : String(v)]);
        }
      });
      return out;
    }

    function renderConfig(cfg) {
      const box = $("cfg");
      box.replaceChildren();
      flatten(cfg, "").forEach(([name, value]) => {
        const row = document.createElement("div");
        row.className = "field";
        const lab = document.createElement("label");
        lab.textContent = name;
        const val = document.createElement("div");
        val.className = "val";
        val.textContent = value;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "copy";
        btn.textContent = "Copy";
        btn.addEventListener("click", async () => {
          try {
            await navigator.clipboard.writeText(value);
            btn.textContent = "Copied";
            btn.classList.add("ok");
            setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("ok"); }, 1200);
          } catch {
            btn.textContent = "Failed";
            setTimeout(() => { btn.textContent = "Copy"; }, 1200);
          }
        });
        row.append(lab, val, btn);
        box.appendChild(row);
      });
    }

    async function loadConfig() {
      const r = await fetch("/api/config");
      if (!r.ok) return;
      renderConfig(await r.json());
    }

    async function boot() {
      const r = await fetch("/api/config");
      needsAuth = r.status === 401;
      showApp(r.ok);
    }
    boot();

    $("login").addEventListener("submit", async (e) => {
      e.preventDefault();
      $("loginerr").textContent = "";
      const r = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: $("pw").value }),
      });
      if (!r.ok) {
        $("loginerr").textContent = "Wrong password";
        return;
      }
      $("pw").value = "";
      showApp(true);
    });
    $("out").addEventListener("click", async () => {
      await fetch("/api/logout", { method: "POST" });
      if (logs) { logs.close(); logs = null; }
      if (statsTimer) { clearInterval(statsTimer); statsTimer = 0; }
      $("logbox").textContent = "";
      $("cfg").replaceChildren();
      $("recent").replaceChildren();
      showApp(false);
    });

    function renderStats(s) {
      $("nreq").textContent = s.requests;
      $("nmask").textContent = s.masked;
      const box = $("recent");
      box.replaceChildren();
      if (!s.recent || !s.recent.length) {
        const p = document.createElement("p");
        p.className = "empty";
        p.textContent = "No proxied requests yet.";
        box.appendChild(p);
        return;
      }
      [...s.recent].reverse().forEach((ev) => {
        const card = document.createElement("div");
        card.className = "req";
        const h = document.createElement("h3");
        h.textContent = (ev.time || "") + "  " + ev.method + " " + ev.path + "  ·  " + ev.masked + " masked";
        card.appendChild(h);
        if (ev.mapping && ev.mapping.length) {
          const table = document.createElement("table");
          const thead = document.createElement("thead");
          const hr = document.createElement("tr");
          ["value", "token"].forEach((t) => {
            const th = document.createElement("th");
            th.textContent = t;
            hr.appendChild(th);
          });
          thead.appendChild(hr);
          const tb = document.createElement("tbody");
          ev.mapping.forEach((p) => {
            const tr = document.createElement("tr");
            const a = document.createElement("td");
            a.textContent = p.value;
            const b = document.createElement("td");
            b.className = "token";
            b.textContent = p.token;
            tr.append(a, b);
            tb.appendChild(tr);
          });
          table.append(thead, tb);
          card.appendChild(table);
        }
        box.appendChild(card);
      });
    }
    async function loadStats() {
      const r = await fetch("/api/stats");
      if (!r.ok) return;
      renderStats(await r.json());
    }
  </script>
</body>
</html>
