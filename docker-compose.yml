services:
  ml-engine:
    build:
      context: .
      dockerfile: Dockerfile.python
      secrets:
        - hf_token
    image: shinel-ml-engine:latest
    # No published ports: reachable only from shinel-net.
    expose:
      - "8000"
    environment:
      SHINEL_CONFIG: /etc/shinel/config.yaml
    volumes:
      - ./config.yaml:/etc/shinel/config.yaml:ro
    networks:
      - shinel-net

  proxy:
    build:
      context: .
      dockerfile: Dockerfile.proxy
    image: shinel-proxy:latest
    ports:
      - "8080:8080"
    environment:
      SHINEL_ML_URL: http://ml-engine:8000/analyze
    volumes:
      - ./config.yaml:/etc/shinel/config.yaml:ro
    depends_on:
      ml-engine:
        condition: service_healthy
    networks:
      - shinel-net

# A regular bridge, not internal: the proxy lives here and still needs
# to reach api.openai.com. Isolation of the sidecar is "no published ports".
networks:
  shinel-net:

# Build-only: the running container does not get this. Compose reads HF_TOKEN
# from the environment or a project `.env` file.
secrets:
  hf_token:
    environment: HF_TOKEN
