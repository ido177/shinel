server:
  port: 8080

providers:
  openai: https://api.openai.com
  anthropic: https://api.anthropic.com
  gemini: https://generativelanguage.googleapis.com

vault:
  # memory | redis
  type: memory
  # used only when type is redis
  # redis_url: redis://localhost:6379/0

# extra strings to mask, matched case-insensitively
custom_words: [orgname, nameorg]
#  - Acme Corporation
#  - Project Bluebird

# debug | info | warn | error
log_level: info

# local dashboard: logs, config, mask stats. Shows real values.
# bind 127.0.0.1 is open on the host; any other bind needs admin.token
# (or SHINEL_ADMIN_TOKEN). Docker compose generates one if unset.
# redact: credentials in the Config tab and process logs (not Stats mappings)
admin:
  port: 8081
  bind: 127.0.0.1
  redact: true

# named entity sidecar; leave url empty to run without it
ml_engine:
  url: ""
  # url: http://ml-engine:8000/analyze
  # HuggingFace id the Python sidecar loads (and bakes into the image)
  model: urchade/gliner_multi-v2.1
  labels:
    - PERSON
    - ORG
    - LOCATION
    - PASSWORD
    - SECRET
  timeout_ms: 15000
