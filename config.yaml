server:
  port: 8080

target_url: https://api.openai.com

vault:
  # memory | redis
  type: memory
  # used only when type is redis
  # redis_url: redis://localhost:6379/0

# extra strings to mask, matched case-insensitively
custom_words: []
#  - Acme Corporation
#  - Project Bluebird

# named entity sidecar; leave url empty to run without it
ml_engine:
  url: ""
  # url: http://ml-engine:8000/analyze
  # HuggingFace id the Python sidecar loads (and bakes into the image)
  model: urchade/gliner_multi-v2.1
  labels:
    - PERSON
    - ORG
    - LOCATION
  timeout_ms: 15000
